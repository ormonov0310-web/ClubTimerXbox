name: Publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-tag]')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          git checkout --detach $tag

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClubTimerXbox-$version.zip"
          ./scripts/package-release.ps1 `
            -Version $version `
            -Channel stable `
            -Notes "Fixes repeated update downloads by releasing package files before verification, and adds automatic plus manual cleanup of obsolete update packages." `
            -DownloadUrl $url `
            -SelfContained

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "release/ClubTimerXbox-$version.zip"
          $notes = @"
          Fixes the repeated update-download loop caused by a locked temporary
          package file. Download streams are now closed before SHA-256 verification
          and package promotion.

          Obsolete downloaded packages are removed automatically after a successful
          update and can also be cleared manually from owner settings. The active
          package, rollback backups and club data remain protected.
          "@

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "Club Timer Xbox $version" `
              --notes $notes
          }
