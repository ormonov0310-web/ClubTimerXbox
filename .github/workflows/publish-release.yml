name: Publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-tag]')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          git checkout --detach $tag

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClubTimerXbox-$version.zip"
          ./scripts/package-release.ps1 `
            -Version $version `
            -Channel stable `
            -Notes "Adds club-scoped product photographs with replace/delete support. Introduces immediate over-plan game bonuses in full 500-som portions, a two-hour participation minimum and fixed integer shares. New bonus rules start on the next business day after installation; past earnings stay unchanged." `
            -DownloadUrl $url `
            -SelfContained

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "release/ClubTimerXbox-$version.zip"
          $notes = @"
          Product photographs are scoped to the selected club and stable product ID.
          Twelve approved stock images are included for Salikhov only. The updated
          owner app can take, select, replace or delete a photo; deletion restores
          branded water without restoring the initial product photo on the next sync.
          Other clubs do not receive Salikhov's initial images. Ordinary snapshots
          carry compact photo references; custom images are cached separately.

          Every full 500 som of finalized game revenue above the configured plan
          creates an immediate bonus portion. The configured bonus rate is retained.
          Only employees with at least two hours in that business day participate,
          with shares based on their hours at that portion's allocation. If nobody
          qualifies yet, full portions wait within the same business day. Each share
          is floored to whole som; existing portions are not redistributed later.
          Partial revenue below 500 som earns no closing bonus and is not carried
          into the next day. Bonuses retain their source business day in statistics.

          The new bonus policy starts on the next business day after the updated PC
          first runs. Previously earned bonuses and closed accounting months remain
          unchanged. Late finalized sessions retain their source day; financial pace
          corrections within an open month are audited. Post-recognition reductions
          that need review are flagged rather than silently rewriting earned pay.

          The package includes the self-contained Windows runtime, all 11 required
          sounds, the branded fallback and all 12 initial product photographs.
          The companion owner APK has been updated locally. Full photo editing
          between the phone and an updated production PC remains a post-update check.
          "@

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "Club Timer Xbox $version" `
              --notes $notes
          }
