name: Publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-tag]')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          git checkout --detach $tag

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClubTimerXbox-$version.zip"
          ./scripts/package-release.ps1 `
            -Version $version `
            -Channel stable `
            -Notes "Cash acceptance now orders physical facts by recount time instead of delayed technical finalization. Restart recovery keeps the original ten-minute deadline, and a new handover closes an older pending handover without duplicating shortages. The confirmed Salikhov 200 som technical duplicate is repaired only when its exact open, unposted records still match." `
            -DownloadUrl $url `
            -SelfContained

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "release/ClubTimerXbox-$version.zip"
          $notes = @"
          Cash acceptance now orders physical facts by the time cash was actually
          recounted, not by a delayed technical finalization after PC startup. A stale
          pending handover can no longer replace a newer recount or owner checkpoint.

          Restart recovery keeps the original ten-minute deadline. A distinct new
          handover closes an older pending handover, while a recount of the same
          handover continues to update its original card without creating another
          shortage.

          The confirmed Salikhov incident is repaired by exact acceptance,
          investigation and reconciliation IDs. The incorrect 4348 som expectation
          is restored to the physical 4148 som fact, and the open 200 som duplicate is
          closed as an input correction without an employee penalty. The repair runs
          only if those exact records are still open and unposted; it refuses to alter
          a formalized penalty or any later card.

          No new Firebase polling, listeners or periodic writes were added. Other
          shortages, extras, penalties, bonuses and owner corrections are unchanged.
          "@

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "Club Timer Xbox $version" `
              --notes $notes
          }
