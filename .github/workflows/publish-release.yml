name: Publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-tag]')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          git checkout --detach $tag

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClubTimerXbox-$version.zip"
          ./scripts/package-release.ps1 `
            -Version $version `
            -Channel stable `
            -Notes "Fixes handover responsibility and early owner correction; refines financial pace; folds goods only after 24 continuous zero-stock hours, with shared phone deadlines and restock cancellation." `
            -DownloadUrl $url `
            -SelfContained

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "release/ClubTimerXbox-$version.zip"
          $notes = @"
          Cash acceptance keeps the outgoing and incoming employees visible during
          the ten-minute review. Owner correction can finalize the reviewed handover
          early after its linked cashless verification. Revision checks and recovery
          prevent duplicated postings or replacement of newer facts after retries.
          Cash responsibility and recommendations use the current investigation.

          Stock, acceptance and sales keep newly empty goods visible for 24 continuous
          hours, then offer an expandable group with the most recently hidden first.
          Replenishment cancels hiding; repeated zero or price edits do not restart
          the timer. The phone stock catalogue uses the same cached UTC deadline.
          Existing zero stock without a date gets a full day on the updated PC.
          Services and the purchase catalogue remain visible; draft inputs survive.

          Financial pace accrues fixed expenses from noon to midnight, keeps saved
          closed days unchanged and avoids projecting partial fixed costs twice.
          The owner app keeps monthly forecast and owner withdrawals visible while
          allowing calculation details to collapse. Live day updates do not replace
          monthly pace data.

          The package includes the self-contained Windows runtime and all 11 required
          alarm/interface sounds. The companion owner APK has been updated locally.
          Personal product photographs are deferred to a future update.
          "@

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "Club Timer Xbox $version" `
              --notes $notes
          }
