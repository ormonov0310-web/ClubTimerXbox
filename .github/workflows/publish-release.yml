name: Publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-tag]')
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          git checkout --detach $tag

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate release regressions
        shell: pwsh
        env:
          CLUBTIMER_TEST_ARTIFACTS: ${{ runner.temp }}/clubtimer-test-artifacts
        run: |
          dotnet run --project ClubTimerXbox.RegressionTests -c Release
          if ($LASTEXITCODE -ne 0) { throw "Release regressions failed" }

      - name: Save UI test renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-input-renders
          path: ${{ runner.temp }}/clubtimer-test-artifacts
          if-no-files-found: ignore

      - name: Package verified release
        if: steps.release.outputs.version != ''
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClubTimerXbox-$version.zip"
          $notes = Get-Content -LiteralPath "docs/release-notes/$version.md" -Raw -Encoding UTF8
          ./scripts/package-release.ps1 `
            -Version $version `
            -Channel stable `
            -Notes $notes `
            -DownloadUrl $url `
            -SelfContained

      - name: Publish GitHub release
        if: steps.release.outputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "release/ClubTimerXbox-$version.zip"
          $notesPath = "docs/release-notes/$version.md"

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "Club Timer Xbox $version" `
              --notes-file $notesPath
          }
