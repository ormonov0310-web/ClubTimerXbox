name: Publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-tag]')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          git checkout --detach $tag

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClubTimerXbox-$version.zip"
          ./scripts/package-release.ps1 `
            -Version $version `
            -Channel stable `
            -Notes "Cash acceptance now uses the latest recount as its physical balance baseline. Payments and expenses already included by that recount are not counted twice. Acceptance, cash summary and owner data use the same calculation; existing cards and manual corrections remain unchanged." `
            -DownloadUrl $url `
            -SelfContained

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "release/ClubTimerXbox-$version.zip"
          $notes = @"
          Cash acceptance and the current cash summary now use one physical-balance
          calculation. A repeated accepted cash fact becomes the new baseline at the
          time of its latest recount, so payments already included in that fact are
          not added again and expenses already included are not subtracted again.

          An owner checkpoint created during the ten-minute acceptance window cannot
          hide a fact finalized later. A genuinely newer checkpoint still becomes the
          baseline. Physical cash follows the real transaction time while accounting
          dates continue to control reports.

          Legacy acceptance records without a saved recount time fall back to their
          original creation time. If the balance calculation cannot be completed,
          acceptance stops instead of treating expected cash as zero. Each accepted
          fact writes a bounded local diagnostic breakdown for future investigation;
          it is not uploaded and does not add Firebase polling or background traffic.

          Existing shortages, extras, penalties, bonuses, owner corrections and
          closed cards are not recalculated or changed by this update.
          "@

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "Club Timer Xbox $version" `
              --notes $notes
          }
