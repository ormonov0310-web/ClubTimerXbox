name: Publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-latest-tag]')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = (git describe --tags --abbrev=0)
          }

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          git checkout --detach $tag

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClubTimerXbox-$version.zip"
          ./scripts/package-release.ps1 `
            -Version $version `
            -Channel stable `
            -Notes "Adds club-local personal employee debt contracts with owner controls, employee history and protected automatic repayment from future earnings. Salary payouts now combine salary and returned debt credit without creating club revenue or a second payroll expense. Freeze requests use fixed terms and local countdowns through the existing compact synchronization path, with no new polling." `
            -DownloadUrl $url `
            -SelfContained

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $asset = "release/ClubTimerXbox-$version.zip"
          $notes = @"
          Adds club-local personal debt contracts between employees. The owner can
          create and manage contracts from the phone, while employees see a concise
          debt card, meaningful balances and dated operations on the club PC.

          Automatic repayment uses only earnings created after the contract or its
          resumption. Each whole som is transferred from the debtor's available salary
          to the creditor's withdrawable credit without becoming club revenue or a
          second payroll expense. A combined payout uses returned debt credit first,
          then the employee's remaining salary, and remains idempotent after retries.

          Debtors may request a freeze for 1, 3, 7 or 10 days. The creditor or owner
          approves or rejects it, a rejection enforces a 12-hour wait, and an approved
          freeze resumes automatically from future earnings after its deadline. The
          countdown is calculated locally and never writes once per second.

          Debt state reuses the existing compact club snapshot and durable phone
          command journal. No new Firebase listener, polling loop or periodic upload
          was added, and existing cash, salary and historical debt-free data are not
          rewritten by the update.
          "@

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --title "Club Timer Xbox $version" `
              --notes $notes
          }
